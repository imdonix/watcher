<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta name="description" content="Watcher — deal alerts for jofogas, ingatlan.com, hasznaltauto.hu and hardverapro.hu" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Watcher" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Watcher</title>
    <script>
      // Blank-screen recovery for the installed PWA (mostly iOS): a stale
      // cached document can point at JS chunks from an older deploy, or iOS
      // can restore a standalone page from the back/forward cache with an
      // empty document after a back gesture. In both cases the app never
      // mounts and the screen stays blank (white or black) — with no address
      // bar to recover from.
      //
      // Rules:
      // 1. Show a small fallback UI instead of ever leaving a blank screen.
      // 2. Never wipe the service worker/caches while offline — that deletes
      //    the only copy of the app and turns a temporary blank into a
      //    permanent white screen.
      // 3. At most a couple of automatic recovery reloads per session.
      (function () {
        var KEY = "watcher_boot_recovery";
        var overlay = null;

        // This script runs in <head>, before #root exists, so look it up
        // lazily every time instead of capturing null here.
        function rootEl() {
          return document.getElementById("root");
        }

        function rootEmpty() {
          var root = rootEl();
          return !root || root.childNodes.length === 0;
        }

        function online() {
          try {
            return navigator.onLine !== false;
          } catch (err) {
            return true;
          }
        }

        function attempts() {
          try {
            return Number(sessionStorage.getItem(KEY)) || 0;
          } catch (err) {
            return 99; // no storage → never auto-recover in a loop
          }
        }

        function setAttempts(n) {
          try {
            sessionStorage.setItem(KEY, String(n));
          } catch (err) {
            /* storage unavailable */
          }
        }

        function showFallback(offline) {
          if (overlay || !document.body) return;
          overlay = document.createElement("div");
          overlay.id = "watcher-fallback";
          overlay.setAttribute("role", "alert");
          overlay.style.cssText =
            "position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;" +
            "justify-content:center;padding:24px;background:#f7f8fa;color:#111827;" +
            "font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;text-align:center;";
          overlay.innerHTML =
            '<main style="max-width:22rem">' +
            '<h1 style="margin:0 0 8px;font-size:18px;letter-spacing:-0.01em">Watcher hit a snag</h1>' +
            '<p style="margin:0 0 20px;font-size:14px;line-height:1.55;color:#6b7280">' +
            (offline
              ? "You are offline and the saved app copy could not start. Reconnect and try again."
              : "The saved app copy could not start. Reload to try again.") +
            "</p>" +
            '<button id="watcher-retry" type="button" style="appearance:none;border:0;' +
            "border-radius:999px;background:#3b5bdb;color:#fff;font:inherit;font-weight:600;" +
            'padding:11px 22px">Reload</button>' +
            "</main>";
          document.body.appendChild(overlay);
          var btn = document.getElementById("watcher-retry");
          if (btn) {
            btn.addEventListener("click", function () {
              hardRecover(true);
            });
          }
        }

        function hideFallback() {
          if (!overlay) return;
          overlay.remove();
          overlay = null;
        }

        function hardRecover(userInitiated) {
          // Never erase the only cached copy while offline. If the user taps
          // Reload we still refuse — reconnecting is the only useful action.
          if (!online()) {
            showFallback(true);
            return;
          }

          var n = attempts();
          if (n >= 2 && !userInitiated) {
            showFallback(false);
            return;
          }
          setAttempts(Math.min(n + 1, 2));

          var reload = function () {
            location.reload();
          };
          var clearCaches = function () {
            if (!window.caches) return Promise.resolve();
            return caches.keys().then(function (keys) {
              return Promise.all(
                keys.map(function (key) {
                  return caches.delete(key);
                }),
              );
            });
          };
          var unregister = function () {
            if (!navigator.serviceWorker) return Promise.resolve();
            return navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(
                regs.map(function (reg) {
                  return reg.unregister();
                }),
              );
            });
          };

          // Show something immediately, then swap the worker/cache and reload.
          showFallback(false);
          Promise.resolve().then(unregister).then(clearCaches).then(reload, reload);
        }

        // React replaces the contents of #root on its first render. Once that
        // happens the app is alive, so drop the fallback and reset the counter.
        function watchRoot() {
          var root = rootEl();
          if (!root) return;
          new MutationObserver(function () {
            if (!rootEmpty()) {
              hideFallback();
              try {
                sessionStorage.removeItem(KEY);
              } catch (err) {
                /* storage unavailable */
              }
            }
          }).observe(root, { childList: true });
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", watchRoot);
        } else {
          watchRoot();
        }

        // A chunk that fails to load (404 after a deploy) fires `error` on the
        // <script> element. The entry bundle lives under /assets/ in prod.
        window.addEventListener(
          "error",
          function (event) {
            var el = event.target;
            if (el && el.tagName === "SCRIPT") {
              var src = el.src || "";
              if (src.indexOf("/assets/") !== -1) hardRecover(false);
            }
          },
          true,
        );

        // Fallback when nothing rendered and we cannot know why. Shorter than
        // the old 12s so the user is not left staring at white. Only runs when
        // a service worker is controlling the page (i.e. installed PWA), so it
        // never interferes with `vite dev`.
        setTimeout(function () {
          if (!navigator.serviceWorker || !navigator.serviceWorker.controller) return;
          if (!rootEmpty()) return;

          // Try one clean reload first; only drop the worker/cache if that
          // did not help.
          if (online() && attempts() === 0) {
            setAttempts(1);
            showFallback(false);
            location.reload();
            return;
          }
          hardRecover(false);
        }, 5000);

        // iOS sometimes restores a standalone page from the back/forward
        // cache with an empty document after a back gesture. Reload instead
        // of leaving the user on a blank screen.
        window.addEventListener("pageshow", function (event) {
          if (!event.persisted) return;
          setTimeout(function () {
            if (!rootEmpty()) return;
            if (online()) hardRecover(false);
            else showFallback(true);
          }, 250);
        });

        // A back/forward traversal is where the standalone window has been
        // reported to go blank. React keeps the old DOM until it commits, so
        // an empty root shortly after popstate means the page really lost its
        // content.
        window.addEventListener("popstate", function () {
          setTimeout(function () {
            if (!rootEmpty()) return;
            if (online()) hardRecover(false);
            else showFallback(true);
          }, 500);
        });

        // Same for a resume from the app switcher: only check after the page
        // was actually hidden, so a slow first boot is not mistaken for a
        // crash.
        var wasHidden = false;
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "hidden") {
            wasHidden = true;
            return;
          }
          if (!wasHidden || !rootEmpty()) return;
          setTimeout(function () {
            if (!rootEmpty()) return;
            if (online()) hardRecover(false);
            else showFallback(true);
          }, 500);
        });
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
