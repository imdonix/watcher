# Full-stack run. All values are embedded here (no .env files).
# Images built from docker/*.Dockerfile (monorepo root context).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: watcher
      POSTGRES_PASSWORD: watcher
      POSTGRES_DB: watcher
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watcher -d watcher"]
      interval: 5s
      timeout: 5s
      retries: 10

  scraper:
    build:
      context: .
      dockerfile: docker/scraper.Dockerfile
    restart: unless-stopped
    environment:
      SCRAPER_PORT: "3001"
      HEADLESS: "true"
      SCRAPER_MAX_CONCURRENCY: "2"
    ports:
      - "3001:3001"
    shm_size: "1gb"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      scraper:
        condition: service_started
    environment:
      API_PORT: "3000"
      DATABASE_URL: postgresql://watcher:watcher@db:5432/watcher
      API_TOKEN: ""
      SCRAP_INTERVAL_MINUTES: "5"
      NOTIFY_HOUR: "8"
      CORS_ORIGIN: http://localhost:8080,http://localhost:5173
      SCRAPER_URL: http://scraper:3001
      VAPID_PUBLIC_KEY: BBYrfVsKv1tXaJZhF693BxVf6LkrgfaNvA8PmBYPvRhHJ9sQzyOoe6mQses823tHcPhuAd67Cy80vrqgNeJ-KgM
      VAPID_PRIVATE_KEY: Ifk6LEVJHQEKUycZdKJNSgLAjSDFzeQ9T6DQiu4KsGk
      VAPID_SUBJECT: mailto:watcher@localhost
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_UPSTREAM: api:3000
    ports:
      - "8080:80"

volumes:
  pgdata:
