{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "watcher.secretName" . }}
  labels:
    {{- include "watcher.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ .Values.secret.postgresPassword | quote }}
  # Built for the in-cluster postgres service
  database-url: {{ printf "postgresql://%s:%s@%s:5432/%s" .Values.postgresql.user .Values.secret.postgresPassword (include "watcher.postgresql.fullname" .) .Values.postgresql.database | quote }}
  api-token: {{ .Values.secret.apiToken | quote }}
  vapid-public-key: {{ .Values.secret.vapidPublicKey | quote }}
  vapid-private-key: {{ .Values.secret.vapidPrivateKey | quote }}
  vapid-subject: {{ .Values.secret.vapidSubject | quote }}
{{- end }}
